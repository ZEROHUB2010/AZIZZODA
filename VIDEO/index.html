<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZEROHUB UI — Mobile Downloader</title>

  <!-- Favicon / Icon -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0b0c10; color: #fff; min-height: 100vh; padding-bottom: 30px; -webkit-tap-highlight-color: transparent; }

    /* Intro Overlay (Full screen for Mobile & Desktop) */
    #intro-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #intro-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    
    /* Экрани калонтар барои видеои интро */
    #intro-video { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; /* Видео мустақиман пурра бе буриш меояд */
      background: #000;
    }

    /* Container & Mobile Layout */
    .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; margin-top: 6px; }
    .header img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
    .header h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Cards - Адаптивӣ барои телефон */
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 14px; margin-bottom: 14px; backdrop-filter: blur(10px); }
    .card label { font-size: 12px; color: #aaa; display: block; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .input-group { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.6); color: #fff; font-size: 14px; outline: none; transition: border 0.3s;
    }
    input[type="text"]:focus { border-color: #ff4b2b; }
    
    button.btn {
      padding: 12px 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: transform 0.1s;
    }
    button.btn:active { transform: scale(0.96); }
    button.btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Results List */
    .results-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .result-item { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 10px; display: flex; gap: 10px; align-items: center; }
    .result-item img { width: 95px; height: 62px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .result-info { flex: 1; min-width: 0; }
    .result-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .result-meta { font-size: 11px; color: #888; }
    .result-actions { display: flex; gap: 6px; margin-top: 6px; }
    .action-btn { flex: 1; padding: 6px 0; font-size: 11px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; color: #fff; text-align: center; }
    .btn-play { background: #e50914; }
    .btn-dl { background: #25d366; }

    /* Modal Video Player (Калон ва қулай барои телефон) */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 8888; backdrop-filter: blur(10px); padding: 12px; }
    .modal-content { background: #12121a; border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; width: 100%; max-width: 500px; padding: 12px; position: relative; }
    .close-modal { position: absolute; top: -38px; right: 4px; color: #fff; font-size: 30px; cursor: pointer; font-weight: bold; }
    
    /* Плеер 16:9 калони стандартӣ */
    .player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }
    .player-wrapper iframe, .player-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    /* Toast Notification */
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff4b2b; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; display: none; z-index: 10000; box-shadow: 0 4px 15px rgba(255,75,43,0.4); text-align: center; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- INTRO OVERLAY -->
  <div id="intro-overlay">
    <video id="intro-video" autoplay muted playsinline>
      <source src="intro.mp4" type="video/mp4">
    </video>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="container">
    <div class="header">
      <img src="icon.png" alt="Icon" onerror="this.style.display='none'">
      <h1>ZEROHUB UI</h1>
    </div>

    <!-- YouTube Link Input -->
    <div class="card">
      <label>Ҷустуҷӯ бо линки YouTube</label>
      <div class="input-group">
        <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=...">
        <button class="btn" id="btn-analyze">Анализ</button>
      </div>
    </div>

    <!-- YouTube Keyword Search -->
    <div class="card">
      <label>Ҷустуҷӯи видео дар YouTube</label>
      <div class="input-group">
        <input type="text" id="search-input" placeholder="Номи видео ё иҷрокунанда...">
        <button class="btn" id="btn-search">Ҷустуҷӯ</button>
      </div>
    </div>

    <!-- Results List -->
    <div id="results-list" class="results-list"></div>
  </div>

  <!-- MODAL VIDEO PLAYER -->
  <div id="player-modal" class="modal">
    <div class="modal-content">
      <span id="close-modal" class="close-modal">&times;</span>
      <div class="player-wrapper" id="modal-player-body"></div>
    </div>
  </div>

  <!-- TOAST ALERT -->
  <div id="toast"></div>

  <!-- SCRIPTS -->
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
