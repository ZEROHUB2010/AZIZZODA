<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEROHUB UI — YouTube Downloader</title>

  <!-- Favicon / Icon -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0c10; color: #fff; min-height: 100vh; padding-bottom: 40px; }

    /* Intro Overlay */
    #intro-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #intro-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #intro-video { width: 100%; height: 100%; object-fit: cover; }
    #skip-intro-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; backdrop-filter: blur(5px); z-index: 10000;
    }

    /* Container & Header */
    .container { max-width: 500px; margin: 0 auto; padding: 20px; }
    .header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; margin-top: 10px; }
    .header img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
    .header h1 { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Card Box */
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 16px; margin-bottom: 16px; backdrop-filter: blur(10px); }
    .card label { font-size: 13px; color: #aaa; display: block; margin-bottom: 8px; font-weight: 500; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.5); color: #fff; font-size: 14px; outline: none; transition: border 0.3s;
    }
    input[type="text"]:focus { border-color: #ff4b2b; }
    
    button.btn {
      padding: 12px 18px; border-radius: 10px; border: none; background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff; font-weight: bold; cursor: pointer; white-space: nowrap; transition: transform 0.1s, opacity 0.2s;
    }
    button.btn:active { transform: scale(0.98); }
    button.btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Results Grid */
    .results-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .result-item { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; }
    .result-item img { width: 90px; height: 60px; object-fit: cover; border-radius: 8px; }
    .result-info { flex: 1; overflow: hidden; }
    .result-title { font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .result-meta { font-size: 11px; color: #aaa; }
    .result-actions { display: flex; gap: 8px; margin-top: 8px; }
    .action-btn { padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 4px; }
    .btn-play { background: #e50914; }
    .btn-dl { background: #25d366; }

    /* Modal Video Player */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 8888; backdrop-filter: blur(8px); }
    .modal-content { background: #1a1a24; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 90%; max-width: 500px; padding: 16px; position: relative; }
    .close-modal { position: absolute; top: -35px; right: 0; color: #fff; font-size: 28px; cursor: pointer; font-weight: bold; }

    /* Toast Notification */
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff4b2b; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; display: none; z-index: 10000; box-shadow: 0 4px 15px rgba(255,75,43,0.4); }
  </style>
</head>
<body>

  <!-- INTRO OVERLAY -->
  <div id="intro-overlay">
    <video id="intro-video" autoplay muted playsinline>
      <source src="intro.mp4" type="video/mp4">
    </video>
    <button id="skip-intro-btn">Гузаштан ➔</button>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="container">
    <div class="header">
      <img src="icon.png" alt="Icon" onerror="this.style.display='none'">
      <h1>ZEROHUB UI</h1>
    </div>

    <!-- YouTube Link Input -->
    <div class="card">
      <label>Ҷустуҷӯ бо линки YouTube</label>
      <div class="input-group">
        <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=...">
        <button class="btn" id="btn-analyze">Анализ</button>
      </div>
    </div>

    <!-- YouTube Keyword Search -->
    <div class="card">
      <label>Ҷустуҷӯи видео ва сурудҳо дар YouTube</label>
      <div class="input-group">
        <input type="text" id="search-input" placeholder="Номи видео ё иҷрокунанда...">
        <button class="btn" id="btn-search">Ҷустуҷӯ</button>
      </div>
    </div>

    <!-- Results List -->
    <div id="results-list" class="results-list"></div>
  </div>

  <!-- MODAL VIDEO PLAYER -->
  <div id="player-modal" class="modal">
    <div class="modal-content">
      <span id="close-modal" class="close-modal">&times;</span>
      <div id="modal-player-body"></div>
    </div>
  </div>

  <!-- TOAST ALERT -->
  <div id="toast"></div>

  <!-- SCRIPTS -->
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
